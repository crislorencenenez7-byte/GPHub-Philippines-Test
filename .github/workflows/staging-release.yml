name: Staging Scheduled Release

on:

  schedule:
    # Check every 5 minutes
    - cron: "*/5 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types:
      - schedule-release


permissions:
  contents: write


concurrency:
  group: staging-scheduled-release
  cancel-in-progress: false


jobs:

  release:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT MAIN
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # CONFIGURE GIT
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # FETCH STAGING
      # ============================================================

      - name: Fetch staging
        run: |
          git fetch origin main
          git fetch origin staging


      # ============================================================
      # READ staging/update.json
      # ============================================================

      - name: Read scheduled update
        id: update
        shell: bash
        run: |

          echo "Checking staging/update.json..."

          if ! git cat-file -e origin/staging:update.json 2>/dev/null; then
            echo "ERROR: staging/update.json not found."
            exit 1
          fi

          git show origin/staging:update.json > /tmp/update.json

          echo ""
          echo "============================================"
          echo "staging/update.json"
          echo "============================================"

          cat /tmp/update.json

          echo "============================================"


          VERSION=$(python3 -c '
          import json
          with open("/tmp/update.json", encoding="utf-8") as f:
              print(json.load(f).get("version", ""))
          ')

          UPDATE_NAME=$(python3 -c '
          import json
          with open("/tmp/update.json", encoding="utf-8") as f:
              print(json.load(f).get("updateName", ""))
          ')

          RELEASE_DATE=$(python3 -c '
          import json
          with open("/tmp/update.json", encoding="utf-8") as f:
              print(json.load(f).get("releaseDate", ""))
          ')

          RELEASE_TIME=$(python3 -c '
          import json
          with open("/tmp/update.json", encoding="utf-8") as f:
              print(json.load(f).get("releaseTime", ""))
          ')

          STATUS=$(python3 -c '
          import json
          with open("/tmp/update.json", encoding="utf-8") as f:
              print(json.load(f).get("status", ""))
          ')


          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "update_name=$UPDATE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "release_time=$RELEASE_TIME" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"


      # ============================================================
      # VALIDATE UPDATE
      # ============================================================

      - name: Validate update
        shell: bash
        run: |

          if [ -z "${{ steps.update.outputs.version }}" ]; then
            echo "ERROR: version is missing."
            exit 1
          fi

          if [ -z "${{ steps.update.outputs.update_name }}" ]; then
            echo "ERROR: updateName is missing."
            exit 1
          fi

          if [ -z "${{ steps.update.outputs.release_date }}" ]; then
            echo "ERROR: releaseDate is missing."
            exit 1
          fi

          if [ -z "${{ steps.update.outputs.release_time }}" ]; then
            echo "ERROR: releaseTime is missing."
            exit 1
          fi


          echo ""
          echo "============================================"
          echo "UPDATE INFORMATION"
          echo "============================================"
          echo "Version:      ${{ steps.update.outputs.version }}"
          echo "Name:         ${{ steps.update.outputs.update_name }}"
          echo "Release Date: ${{ steps.update.outputs.release_date }}"
          echo "Release Time: ${{ steps.update.outputs.release_time }}"
          echo "Status:       ${{ steps.update.outputs.status }}"
          echo "============================================"


      # ============================================================
      # CHECK RELEASE TIME
      #
      # Philippine Time = UTC+8
      # ============================================================

      - name: Check release time
        id: release_check
        shell: bash
        run: |

          python3 << 'PY'

          import json
          import os

          from datetime import (
              datetime,
              timezone,
              timedelta
          )


          with open(
              "/tmp/update.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          release_date = data.get("releaseDate")
          release_time = data.get("releaseTime")


          if not release_date:
              print("ERROR: releaseDate missing.")
              raise SystemExit(1)


          if not release_time:
              print("ERROR: releaseTime missing.")
              raise SystemExit(1)


          # Philippine Standard Time
          ph_timezone = timezone(
              timedelta(hours=8)
          )


          release = datetime.fromisoformat(
              f"{release_date}T{release_time}:00+08:00"
          )


          now = datetime.now(
              ph_timezone
          )


          print(
              "Current PH time:",
              now.isoformat()
          )

          print(
              "Release PH time:",
              release.isoformat()
          )


          if now >= release:

              print("RELEASE TIME REACHED")

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as output:

                  output.write(
                      "ready=true\n"
                  )

          else:

              print("Release is not ready yet.")

              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8"
              ) as output:

                  output.write(
                      "ready=false\n"
                  )

          PY


      # ============================================================
      # NOT READY
      # ============================================================

      - name: Release not ready
        if: steps.release_check.outputs.ready != 'true'
        run: |

          echo "============================================"
          echo "RELEASE NOT READY"
          echo "============================================"

          echo "Waiting for:"
          echo "${{ steps.update.outputs.release_date }}"
          echo "${{ steps.update.outputs.release_time }} PH"

          echo "============================================"


      # ============================================================
      # RELEASE STAGING FILES
      #
      # IMPORTANT:
      #
      # We DO NOT merge staging.
      #
      # This avoids conflicts with:
      #
      # main/version.json
      #
      # because version.json is generated by this workflow.
      # ============================================================

      - name: Release staging files
        if: steps.release_check.outputs.ready == 'true'
        shell: bash
        run: |

          echo "============================================"
          echo "RELEASING STAGING FILES"
          echo "============================================"


          # Get the complete staging tree
          git archive origin/staging | tar -x


          # Restore update.json from staging temporarily
          # It will be removed before committing main.

          echo ""
          echo "Staging files copied."


      # ============================================================
      # REMOVE update.json
      #
      # update.json is only for staging scheduling.
      # It must NOT remain in main.
      # ============================================================

      - name: Remove update.json
        if: steps.release_check.outputs.ready == 'true'
        run: |

          if [ -f "update.json" ]; then

            rm -f update.json

            echo "Removed update.json from release."

          else

            echo "update.json is not present."

          fi


      # ============================================================
      # CREATE version.json
      # ============================================================

      - name: Create version.json
        if: steps.release_check.outputs.ready == 'true'
        shell: bash
        run: |

          cat > version.json << EOF
          {
            "version": "${{ steps.update.outputs.version }}",
            "updateName": "${{ steps.update.outputs.update_name }}",
            "releaseDate": "${{ steps.update.outputs.release_date }}",
            "releaseTime": "${{ steps.update.outputs.release_time }}",
            "status": "released"
          }
          EOF


          echo ""
          echo "============================================"
          echo "NEW version.json"
          echo "============================================"

          cat version.json

          echo "============================================"


      # ============================================================
      # SHOW CHANGES
      # ============================================================

      - name: Show release changes
        if: steps.release_check.outputs.ready == 'true'
        run: |

          echo "============================================"
          echo "RELEASE CHANGES"
          echo "============================================"

          git status --short

          echo "============================================"


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit release
        if: steps.release_check.outputs.ready == 'true'
        shell: bash
        run: |

          git add -A

          git add version.json


          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "Release v${{ steps.update.outputs.version }}"

          fi


      # ============================================================
      # PUSH MAIN
      # ============================================================

      - name: Push release
        if: steps.release_check.outputs.ready == 'true'
        run: |

          git push origin main


      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Release completed
        if: steps.release_check.outputs.ready == 'true'
        run: |

          echo ""
          echo "============================================"
          echo "UPDATE RELEASED SUCCESSFULLY"
          echo "============================================"

          echo "Version:"
          echo "${{ steps.update.outputs.version }}"

          echo ""

          echo "Name:"
          echo "${{ steps.update.outputs.update_name }}"

          echo ""

          echo "Release Date:"
          echo "${{ steps.update.outputs.release_date }}"

          echo ""

          echo "Release Time:"
          echo "${{ steps.update.outputs.release_time }} PH"

          echo ""

          echo "Source:"
          echo "staging/update.json"

          echo ""

          echo "Target:"
          echo "main"

          echo ""

          echo "============================================"
